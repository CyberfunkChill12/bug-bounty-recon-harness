services:
  harness-mcp:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Arming code for active tools (read from your shell at launch; not stored in this file).
      - ACTIVE_ARM_CODE=${ACTIVE_ARM_CODE:-__unset__}
      # Optional API keys/tokens for passive sources — passed through from your shell if set.
      - PDCP_API_KEY=${PDCP_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
      # Burp proxy toggle: empty = OFF (tools connect directly). Set to Burp's listener to
      # route active web tools (httpx/nuclei/subzy) through Burp, e.g.
      #   BURP_PROXY=http://host.docker.internal:8080 docker compose up -d
      - BURP_PROXY=${BURP_PROXY:-}
    extra_hosts:
      # lets the container reach Burp running on your host (Mac/Win/Linux)
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
