services:
  harness-mcp:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Arming code for active tools (read from your shell at launch; not stored in this file).
      - ACTIVE_ARM_CODE=${ACTIVE_ARM_CODE:-__unset__}
      # Optional API keys/tokens for passive sources — passed through from your shell if set.
      - PDCP_API_KEY=${PDCP_API_KEY:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITLAB_TOKEN=${GITLAB_TOKEN:-}
      - SHODAN_API_KEY=${SHODAN_API_KEY:-}
    volumes:
      - ./data:/data
